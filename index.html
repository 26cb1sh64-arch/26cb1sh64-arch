
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>InsureAI</title>

<style>
* {
    box-sizing: border-box;
    font-family: Arial, sans-serif;
}

body {
    margin: 0;
    background: #f3f6fa;
    color: #1b2b40;
}

header {
    background: #102b46;
    color: white;
    padding: 22px 8%;
    font-size: 25px;
    font-weight: bold;
}

header span {
    color: #42d6a4;
}

.container {
    max-width: 750px;
    margin: 45px auto;
    padding: 20px;
}

h1 {
    text-align: center;
    margin-bottom: 10px;
}

.subtitle {
    text-align: center;
    color: #778497;
    margin-bottom: 30px;
}

.card {
    background: white;
    padding: 28px;
    border-radius: 14px;
    box-shadow: 0 5px 25px #0000000c;
}

label {
    display: block;
    font-weight: bold;
    margin: 18px 0 8px;
}

input, select, textarea {
    width: 100%;
    padding: 13px;
    border: 1px solid #d6dee8;
    border-radius: 7px;
    font-size: 15px;
}

textarea {
    min-height: 100px;
    resize: vertical;
}

button {
    width: 100%;
    margin-top: 22px;
    padding: 15px;
    background: #1264a3;
    border: none;
    color: white;
    font-size: 16px;
    font-weight: bold;
    border-radius: 7px;
    cursor: pointer;
}

button:disabled {
    opacity: 0.6;
    cursor: wait;
}

#status {
    margin-top: 20px;
    color: #2475ae;
    text-align: center;
}

#result {
    display: none;
    margin-top: 25px;
    padding: 20px;
    background: #eef6ff;
    border-left: 4px solid #3286d8;
    border-radius: 8px;
    line-height: 1.7;
    white-space: pre-wrap;
    overflow-wrap: anywhere;
}

footer {
    text-align: center;
    color: #8995a3;
    font-size: 12px;
    padding: 25px;
}
</style>
</head>

<body>

<header>Insure<span>AI</span></header>

<div class="container">

    <h1>Insurance Analysis</h1>

    <p class="subtitle">
        AI-powered insurance information assistant
    </p>

    <div class="card">

        <label>Insurance Category</label>
        <select id="category">
            <option>Health Insurance</option>
            <option>Life Insurance</option>
            <option>Vehicle Insurance</option>
            <option>Travel Insurance</option>
            <option>Other</option>
        </select>

        <label>Age</label>
        <input type="number" id="age" value="25" min="18" max="100">

        <label>Required Coverage (INR)</label>
        <input type="number" id="coverage" value="500000" min="1">

        <label>Additional Information</label>
        <textarea
            id="details"
            placeholder="Enter additional insurance requirements..."
        ></textarea>

        <button id="submitBtn" onclick="sendRequest()">
            Generate Analysis →
        </button>

        <div id="status"></div>

        <div id="result"></div>

    </div>
</div>

<footer>
    InsureAI | AI-generated educational information
</footer>

<script>

// PASTE YOUR GEMINI API KEY BELOW
const API_KEY = "AQ.Ab8RN6Ivw1PXYcxcSUeJXCV8KMtAHa7g1b2qiAezWibVkxJFCw";


async function sendRequest() {

    const apiKey = API_KEY;
    const category = document.getElementById("category").value;
    const age = Number(document.getElementById("age").value);
    const coverage = Number(document.getElementById("coverage").value);
    const details = document.getElementById("details").value.trim();

    const status = document.getElementById("status");
    const result = document.getElementById("result");
    const button = document.getElementById("submitBtn");

    if (!apiKey || apiKey === "PASTE_YOUR_GEMINI_API_KEY_HERE") {
        alert("Please add your Gemini API key inside the code.");
        return;
    }

    if (!Number.isInteger(age) || age < 18 || age > 100 ||
        !Number.isSafeInteger(coverage) || coverage <= 0) {
        alert("Please enter valid age and coverage values.");
        return;
    }

    const prompt = `
You are InsureAI, an intelligent insurance assistant.

Analyze this insurance information:

Insurance Category: ${category}
Age: ${age}
Required Coverage: INR ${coverage}
Additional Information: ${details || "Not provided"}

Provide a structured analysis containing:

1. User Profile Summary
2. Insurance Requirements
3. Important Coverage Considerations
4. Factors Affecting Premium
5. Important Questions
6. Recommendations and Next Steps

Use simple language.
Do not invent insurance premiums or policy terms.
Do not guarantee claim approval.
Clearly explain that this is general information,
not professional insurance advice.
`;

    button.disabled = true;
    button.textContent = "Analyzing...";
    status.textContent = "Connecting to Gemini AI...";
    result.style.display = "none";

    try {

        const response = await fetch(
            "https://generativelanguage.googleapis.com/v1beta/interactions",
            {
                method: "POST",
                headers: {
                    "Content-Type": "application/json",
                    "x-goog-api-key": apiKey
                },
                body: JSON.stringify({
                    model: "gemini-3.8-flash",
                    input: prompt
                })
            }
        );

        const data = await response.json();

        if (!response.ok) {
            throw new Error(
                data.error?.message || "Gemini API request failed"
            );
        }

        const answer = (data.steps || [])
            .filter(step => step.type === "model_output")
            .flatMap(step => step.content || [])
            .filter(part => part.type === "text")
            .map(part => part.text)
            .join("\n");

        if (!answer) {
            throw new Error("No AI response received.");
        }

        result.textContent = answer;
        result.style.display = "block";
        status.textContent = "Analysis completed successfully.";

    } catch(error) {

        status.textContent = "Something went wrong.";
        result.textContent = error.message;
        result.style.display = "block";

    } finally {

        button.disabled = false;
        button.textContent = "Generate Analysis →";

    }
}

</script>

</body>
</html>
